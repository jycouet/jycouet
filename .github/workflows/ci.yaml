name: CI

on:
  pull_request:

jobs:
  renovate:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🎉 Checkout Repository
        uses: actions/checkout@v7

      - name: 🛠️ node setup
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: 🧹 validate renovate preset
        run: npx -y --package renovate -- renovate-config-validator shared-config/renovate/default.json5
